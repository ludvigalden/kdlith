# Secret and policy scan baseline.
#
# This config is committed so that a fresh clone reproduces the scan
# verdicts with the pinned binary and no local tooling:
#
#   betterleaks fs .  --config .config/generated/tools/security/betterleaks.toml
#   betterleaks git . --config .config/generated/tools/security/betterleaks.toml
#
# The two forms cover the working tree and every commit's patch
# fragments across all refs; findings exit non-zero, so the same
# invocation is the CI gate. The default rule set is inherited below.
# Add custom rules through the mirrored override file rather than
# editing here: a direct edit inside the generated tree is flagged by
# sync and never silently overwritten.

title = 'secret and policy scan'
minVersion = 'v2.0.0-rc.1'

[extend]
useDefault = true
